plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Giai doan 2 se them Litematica/MaLiLib qua Modrinth Maven:
    // exclusiveContent {
    //     forRepository { maven { url = "https://api.modrinth.com/maven" } }
    //     filter { includeGroup "maven.modrinth" }
    // }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Giai doan 2:
    // modCompileOnly "maven.modrinth:bEpr0Arc:R9maucI8"   // Litematica 1.21.11-0.26.11
    // modCompileOnly "maven.modrinth:malilib:0.27.2"      // MaLiLib (phai khop voi Litematica)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
